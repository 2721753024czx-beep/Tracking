name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit public files
        run: python3 3.0/工具/sync_github.py --check
      - name: Compile Python sources
        run: python3 -m compileall -q 3.0/app/tracking3 3.0/app/tools 3.0/工具/sync_github.py
      - name: Publication and model preparation tests (no model downloads)
        working-directory: 3.0/app
        run: |
          python3 -m unittest discover -s tests -p 'test_github_sync.py' -v
          PYTHONPATH=tests python3 -m unittest test_prepare_models.PrepareModels -v
      - name: Browser logic tests
        working-directory: 3.0/app
        run: node --test tests/test_candidate_browser.cjs
